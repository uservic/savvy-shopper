services:
  db:
    image: postgres:15-alpine
    container_name: savvy_db
    environment:
      POSTGRES_USER: savvy
      POSTGRES_PASSWORD: savvy_pass
      POSTGRES_DB: savvy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savvy -d savvy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: savvy_backend
    command: uvicorn savvy_shopper.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://savvy:savvy_pass@db:5432/savvy_db
      OLLAMA_BASE_URL: http://docker.internal
      OLLAMA_MODEL: qwen2.5:14b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    container_name: savvy_frontend
    command: streamlit run src/savvy_shopper/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
